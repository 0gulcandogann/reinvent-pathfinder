[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reinvent-pathfinder"
version = "0.1.0"
description = "Offline-first re:Invent schedule planning and optimization"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = [".", "apps/api"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["apps/api", "scripts"]
extend-exclude = ["PROJECT_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
